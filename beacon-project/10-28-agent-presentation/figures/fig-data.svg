<text x="1054" y="216" font-size="12.5" font-weight="600" text-anchor="start" fill="#1f2937">range_from · range_to</text>
<text x="1358" y="216" font-size="12" font-weight="400" text-anchor="end" fill="#5b6472">실제로 찾은 기간</text>
<text x="1054" y="240" font-size="12.5" font-weight="600" text-anchor="start" fill="#1f2937">row_count · ok</text>
<text x="1358" y="240" font-size="12" font-weight="400" text-anchor="end" fill="#5b6472">건수 · 성공</text>
<path d="M680,130 L716,130" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<text x="700" y="152" font-size="12.5" font-weight="700" text-anchor="start" fill="#e08a00">1 : N</text>
<path d="M1000,130 L1036,130" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<text x="1008" y="152" font-size="12.5" font-weight="700" text-anchor="start" fill="#e08a00">1 : N</text>
<path d="M860,256 C860,340 400,340 334,250" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head)"/>
<text x="600" y="352" font-size="13" font-weight="600" text-anchor="middle" fill="#5b6472">답 카드의 근거 번호 → 이벤트</text>
<rect x="1040" y="330" width="330" height="150" rx="10" fill="#f4f4f3" stroke="#a8a29e" stroke-width="1.6"/>
<path d="M1040,370 L1370,370" stroke="#a8a29e" stroke-width="1.2"/>
<text x="1054" y="356" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">audit_log</text>
<text x="1358" y="356" font-size="12" font-weight="500" text-anchor="end" fill="#5b6472">감사 로그</text>
<text x="1054" y="396" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b6472">action = AGENT_TOOL_CALLED (이번부터 기록)</text>
<text x="1054" y="420" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b6472">누가 · 언제 · 어떤 역할로</text>
<text x="1054" y="444" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b6472">details: 질문 · 도구 · 조건 · 건수 · 성공</text>
<path d="M1205,262 L1205,326" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head)"/>
<text x="1215" y="300" font-size="12.5" font-weight="600" text-anchor="start" fill="#5b6472">도구를 부를 때마다 한 줄</text>
<rect x="30" y="400" width="960" height="120" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.6"/>
<text x="50" y="430" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">얼마나 남기나</text>
<text x="50" y="458" font-size="13.5" font-weight="400" text-anchor="start" fill="#5b6472">대화 · 메시지 · 도구 호출: 마지막 메시지 30일 뒤 자동 삭제 (6시간마다 정리), 본인이 바로 지울 수도 있다</text>
<text x="50" y="484" font-size="13.5" font-weight="400" text-anchor="start" fill="#5b6472">감사 로그: 지우지 않는다    ·    이벤트: 에이전트는 읽기만 하고 고치지 않는다</text>
