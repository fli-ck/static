<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
<marker id="head-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="24" width="18" height="18" rx="4" fill="#f1ecff" stroke="#7c5cd6" stroke-width="1.6"/>
<text x="56" y="38" font-size="14" font-weight="500" text-anchor="start" fill="#1f2937">AI가 하는 일</text>
<rect x="180" y="24" width="18" height="18" rx="4" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="206" y="38" font-size="14" font-weight="500" text-anchor="start" fill="#1f2937">Beacon 코드가 하는 일</text>
<rect x="30" y="157" width="96" height="56" rx="28" fill="#f4f4f3" stroke="#a8a29e" stroke-width="1.6"/>
<text x="78" y="191" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">질문</text>
<rect x="170" y="110" width="210" height="150" rx="12" fill="#f1ecff" stroke="#7c5cd6" stroke-width="1.6"/>
<text x="188" y="146" font-size="18" font-weight="700" text-anchor="start" fill="#1f2937">① 질문 가르기</text>
<text x="188" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">읽기인가, 쓰기인가</text>
<text x="188" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">헷갈리면 읽기로 본다</text>
<rect x="188" y="222" width="61" height="22" rx="11" fill="#7c5cd6"/>
<text x="218.5" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">AI 1번</text>
<rect x="420" y="110" width="210" height="150" rx="12" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="438" y="146" font-size="18" font-weight="700" text-anchor="start" fill="#1f2937">② 찾기</text>
<text x="438" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">AI가 도구·조건을 고르면</text>
<text x="438" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">Beacon이 실행해 돌려준다</text>
<rect x="438" y="222" width="70" height="22" rx="11" fill="#3b6fd8"/>
<text x="473.0" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">최대 5번</text>
<rect x="670" y="110" width="210" height="150" rx="12" fill="#f1ecff" stroke="#7c5cd6" stroke-width="1.6"/>
<text x="688" y="146" font-size="18" font-weight="700" text-anchor="start" fill="#1f2937">③ 답 쓰기</text>
<text x="688" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">정해진 모양으로만</text>
<text x="688" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">한 줄 답 · 카드 · 추천 질문</text>
<rect x="688" y="222" width="49" height="22" rx="11" fill="#7c5cd6"/>
<text x="712.5" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">JSON</text>
<rect x="920" y="110" width="210" height="150" rx="12" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="938" y="146" font-size="18" font-weight="700" text-anchor="start" fill="#1f2937">④ 근거 검사</text>
<text x="938" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">실제로 찾지 않은 이벤트</text>
<text x="938" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">번호는 지운다</text>
<rect x="938" y="222" width="75" height="22" rx="11" fill="#3b6fd8"/>
<text x="975.5" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">서버 검사</text>
<rect x="1170" y="110" width="210" height="150" rx="12" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="1188" y="146" font-size="18" font-weight="700" text-anchor="start" fill="#1f2937">⑤ 저장 → 전송</text>
<text x="1188" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">먼저 저장하고</text>
<text x="1188" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">화면에 한 번에 보낸다</text>
<rect x="1188" y="222" width="42" height="22" rx="11" fill="#3b6fd8"/>
<text x="1209.0" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">SSE</text>
<path d="M126,185 L166,185" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M380,185 L416,185" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M630,185 L666,185" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M880,185 L916,185" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M1130,185 L1166,185" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M470,110 C470,66 580,66 580,106" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#head)"/>
<text x="525" y="70" font-size="13" font-weight="600" text-anchor="middle" fill="#3b6fd8">AI ↔ Beacon 왕복</text>
<rect x="530" y="222" width="78" height="22" rx="11" fill="#7c5cd6"/>
<text x="569.0" y="237.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">AI가 고름</text>
<path d="M275,260 L275,296" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head)"/>
<rect x="170" y="300" width="210" height="100" rx="10" fill="#f4f4f3" stroke="#a8a29e" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="188" y="328" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">쓰기 요청이면</text>
<text x="188" y="354" font-size="13" font-weight="400" text-anchor="start" fill="#5b6472">예: &quot;점검 잡아줘&quot;</text>
<text x="188" y="374" font-size="13" font-weight="400" text-anchor="start" fill="#5b6472">지금은 안내 한 줄로 끝</text>
<path d="M525,260 L525,296" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head)"/>
<rect x="420" y="300" width="210" height="100" rx="10" fill="#e8f1ff" stroke="#3b6fd8" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="438" y="328" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">도구 2개 (읽기만)</text>
<text x="438" y="354" font-size="13" font-weight="400" text-anchor="start" fill="#5b6472">출처 확인</text>
<text x="438" y="374" font-size="13" font-weight="400" text-anchor="start" fill="#5b6472">이벤트 찾기 (최대 50건)</text>
<rect x="670" y="300" width="710" height="100" rx="10" fill="#f4f4f3" stroke="#a8a29e" stroke-width="1.6"/>
<text x="690" y="328" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">기다리는 동안 화면에는 지금 단계 하나만 보인다</text>
<text x="690" y="360" font-size="14" font-weight="400" text-anchor="start" fill="#5b6472">질문을 읽는 중 → 출처 확인 중 → 이벤트 찾기 중 → 이벤트 찾기 완료 → 답</text>
</svg>
